<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- =====================================================================
       ZeroPlus — أيقونة maskable (Android Adaptive Icons / TWA)
       نفس الهوية البصرية تماماً لأيقونة icon.svg (نفس التدرّج، نفس الحرف Z،
       نفس علامة +). الفرق الوحيد:
         1) الخلفية ملء الإطار بالكامل بلا زوايا مستديرة (maskable يشترطها).
         2) الشعار مصغّر إلى ~62% في المنتصف ليبقى داخل «المنطقة الآمنة»
            (الدائرة الداخلية بنسبة 66–80%) فلا يُقصّ عند أي قناع أندرويد.
       لا تلوين جديداً ولا شكل جديداً — نفس الأصول المعاد استخدامها.
       ===================================================================== -->
  <defs>
    <linearGradient id="primaryNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2F76"/>
      <stop offset="100%" stop-color="#123d8f"/>
    </linearGradient>
  </defs>

  <!-- خلفية كاملة: مطلوبة حتى لا تظهر زوايا شفافة تحت قناع أندرويد -->
  <rect width="512" height="512" fill="url(#primaryNavy)"/>

  <!-- الشعار الأصلي مقياس 0.62 حول مركزه (مركز الشعار ≈ 255.5,254) -->
  <g transform="translate(256 254) scale(0.62) translate(-255.5 -254)">
    <g transform="translate(-30 0)">
      <path d="M 128 158 H 302 V 200 L 196 298 H 304 V 342 H 126 V 300 L 234 202 H 128 Z" fill="#F5FEFF"/>
      <path transform="translate(14 0)" d="M 355 210 L 355 260 L 305 260 L 305 300 L 355 300 L 355 350 L 395 350 L 395 300 L 445 300 L 445 260 L 395 260 L 395 210 Z" fill="#AAC0E1"/>
    </g>
  </g>
</svg>
